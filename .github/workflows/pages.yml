name: Publish verified dougong exhibit
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Reassemble and verify the tested static bundle
        run: |
          cat deployment/site.part* > site.zip
          echo "1868cfb9cfcf956fad4b0c77661e2a418b73e2dc56a671e3c877e9c270cc70bc  site.zip" | sha256sum --check
          unzip -q site.zip -d dist
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
